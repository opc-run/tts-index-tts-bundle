name: lint

on:
  push:
  pull_request:

jobs:
  shellcheck:
    name: shellcheck (sh scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run shellcheck
        run: shellcheck *.sh

  powershell-parse:
    name: PowerShell syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path . -Filter *.ps1 -File | Sort-Object Name
          if ($files.Count -eq 0) { Write-Error "No .ps1 files found"; exit 1 }
          foreach ($f in $files) {
            $errs = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $f.FullName), [ref]$null, [ref]$errs)
            if ($errs.Count -gt 0) {
              $errs | ForEach-Object { Write-Error "  $($f.Name) : $($_.Message)" }
              exit 1
            }
            Write-Host "OK: $($f.Name)"
          }
